[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queuemaxxing"
version = "0.1.0"
description = "Composable durable frankenstein queue (FIFO/LIFO, priority, delay)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-timeout>=2.3.0",
]

[project.scripts]
queuemaxxing = "queuemaxxing.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
